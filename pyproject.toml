[project]
name = "taktiny"
version = "0.0.1"
description = "A Deep Learning framework built on JAX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aqtp>=0.9.0",
    "grain>=0.2.18",
    "jax>=0.10.2",
    "qwix>=0.1.8",
    "safetensors>=0.8.0",
    "transformers>=5.13.0",
]
classifiers = [
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.optional-dependencies]
tensorboard = ["tensorboardX"]
wandb = ["wandb"]
reporting = ["tensorboardX", "wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "diffusers>=0.39.0",
    "equinox>=0.13.8",
    "flax>=0.12.7",
    "optax>=0.2.8",
    "pytest>=9.1.1",
    "taktiny",
    "tiktoken>=0.13.0",
    "torchvision>=0.27.1",
]

[tool.pytest.ini_options]
markers = [
    "gpu: requires a JAX GPU backend",
    "tpu: requires a JAX TPU backend",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.uv.sources]
taktiny = { workspace = true }
