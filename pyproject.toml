[project]
name = "taktiny"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aqtp>=0.9.0",
    "datasets>=5.0.1",
    "grain>=0.2.18",
    "huggingface-hub>=1.22.0",
    "jax>=0.10.2",
    "orbax-checkpoint>=0.12.1",
    "qwix>=0.1.8",
    "safetensors>=0.8.0",
    "transformers>=5.13.0",
]

[project.optional-dependencies]
tensorboard = ["tensorboardX"]
wandb = ["wandb"]
reporting = ["tensorboardX", "wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dextiny",
    "diffusers>=0.39.0",
    "equinox>=0.13.8",
    "flax>=0.12.7",
    "optax>=0.2.8",
    "pytest>=9.1.1",
    "tiktoken>=0.13.0",
    "torchvision>=0.27.1",
]

[tool.uv.sources]
dextiny = { git = "https://github.com/solitariusai/dextiny" }

[tool.pytest.ini_options]
markers = [
    "gpu: requires a JAX GPU backend",
    "tpu: requires a JAX TPU backend",
]
